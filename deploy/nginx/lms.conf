# Single-server setup: website and API on one EC2 host.
# /etc/nginx/sites-available/lms.conf  →  ln -s to sites-enabled, then `sudo certbot --nginx -d <host>`
# Certbot adds the listen 443 / ssl_certificate lines and the HTTP → HTTPS redirect.
# The API runs with TRUST_PROXY=1 (Nginx is the only proxy).

server {
    listen 80;
    server_name learnhub.mrt.lk 16-16-111-216.sslip.io;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Express API (PM2: lp-api)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        # The API gives OpenAI 20s (OPENAI_TIMEOUT_MS); keep Nginx above that
        # so users see the API's friendly error instead of a 504.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Next.js (PM2: lp-web)
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
