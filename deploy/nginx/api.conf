# /etc/nginx/sites-available/api.conf  →  ln -s to sites-enabled, then `sudo certbot --nginx -d api.example.com`
# Certbot adds the listen 443 / ssl_certificate lines and the HTTP → HTTPS redirect.

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API gives OpenAI 20s (OPENAI_TIMEOUT_MS); keep Nginx above that
        # so users see the API's friendly error instead of a 504.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
