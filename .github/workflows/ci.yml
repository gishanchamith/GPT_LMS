name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The API tests start an in-memory MongoDB; cache its ~800 MB binary between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-v1

      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test (API + web)
        run: npm test
      - name: Build web
        run: npm run build
      - name: Build API bundle
        run: npm run build -w @lp/api
